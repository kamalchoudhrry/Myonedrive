<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Drive</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #202124;
    background: #fff;
}

.app {
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    border-right: 1px solid #e5e7eb;
    padding: 18px 12px;
    background: #fff;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    margin: 4px 10px 24px;
}

.logoMark {
    font-size: 25px;
}

.new {
    border: 1px solid #dadce0;
    background: #fff;
    border-radius: 18px;
    padding: 13px 22px;
    font-size: 15px;
    box-shadow: 0 1px 2px #ddd;
    cursor: pointer;
    margin-bottom: 18px;
}

.new:hover {
    background: #f8fafd;
}

.nav div {
    padding: 10px 15px;
    border-radius: 20px;
    margin: 3px 0;
    cursor: pointer;
}

.nav div:hover,
.nav .active {
    background: #e8f0fe;
}

.storage {
    margin: 25px 15px;
}

.bar {
    height: 6px;
    background: #e8eaed;
    border-radius: 5px;
    overflow: hidden;
}

.bar span {
    display: block;
    width: 35%;
    height: 100%;
    background: #1a73e8;
}

.storage small {
    display: block;
    margin-top: 10px;
    color: #5f6368;
}

/* MAIN */
.main {
    flex: 1;
    min-width: 0;
}

.top {
    height: 76px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 25px;
}

.search {
    flex: 1;
    max-width: 720px;
    background: #f1f3f4;
    border-radius: 28px;
    padding: 14px 20px;
    display: flex;
    gap: 12px;
}

.search input {
    border: 0;
    background: transparent;
    outline: 0;
    width: 100%;
    font-size: 16px;
}

.actions {
    display: flex;
    gap: 10px;
}

.icon {
    border: 0;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
}

/* CONTENT */
.content {
    padding: 28px;
    overflow: auto;
    height: calc(100vh - 76px);
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.heading h2 {
    font-size: 22px;
    font-weight: 400;
}

.view button {
    border: 0;
    background: transparent;
    font-size: 19px;
    cursor: pointer;
}

/* FOLDER CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(210px, 1fr)
    );
    gap: 15px;
    margin-top: 18px;
}

.card {
    border: 1px solid #dadce0;
    border-radius: 10px;
    padding: 17px;
    cursor: pointer;
    transition: .15s;
}

.card:hover {
    background: #f8f9fa;
    box-shadow: 0 1px 3px #ddd;
}

.folderIcon {
    font-size: 28px;
}

.cardTitle {
    margin-top: 15px;
    font-size: 15px;
}

.meta {
    color: #70757a;
    font-size: 12px;
    margin-top: 7px;
}

/* FILE TABLE */
.table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
}

.table th {
    text-align: left;
    color: #5f6368;
    font-weight: 500;
    font-size: 13px;
    border-bottom: 1px solid #dadce0;
    padding: 12px;
}

.table td {
    padding: 14px 12px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

.fileName {
    display: flex;
    gap: 12px;
    align-items: center;
}

.fileIcon {
    font-size: 22px;
}

.empty {
    padding: 60px;
    text-align: center;
    color: #777;
    display: none;
}

/* MOBILE */
@media(max-width:700px) {

    .sidebar {
        width: 70px;
    }

    .sidebar .label,
    .storage,
    .logo span {
        display: none;
    }

    .logo {
        justify-content: center;
    }

    .new {
        font-size: 0;
        padding: 14px;
        border-radius: 50%;
    }

    .new:after {
        content: '+';
        font-size: 22px;
    }

    .nav div {
        text-align: center;
        padding: 12px;
    }

    .content {
        padding: 18px;
    }

    .top {
        padding: 0 12px;
    }

    .actions {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        <span class="logoMark">▰</span>
        <span>My Drive</span>
    </div>

    <button class="new" onclick="uploadFile()">
        ＋ New
    </button>

    <input
        id="fileInput"
        type="file"
        multiple
        hidden
        onchange="handleFiles(this.files)"
    >

    <nav class="nav">

        <div class="active">
            📁
            <span class="label">My Drive</span>
        </div>

        <div>
            💻
            <span class="label">Computers</span>
        </div>

        <div>
            👥
            <span class="label">Shared with me</span>
        </div>

        <div>
            🕘
            <span class="label">Recent</span>
        </div>

        <div>
            ⭐
            <span class="label">Starred</span>
        </div>

        <div>
            🗑️
            <span class="label">Trash</span>
        </div>

    </nav>

    <div class="storage">

        <div class="bar">
            <span></span>
        </div>

        <small>
            3.5 GB of 10 GB used
        </small>

    </div>

</aside>


<!-- MAIN -->
<main class="main">

<header class="top">

    <div class="search">

        🔎

        <input
            id="search"
            placeholder="Search in Drive"
            oninput="render()"
        >

    </div>

    <div class="actions">

        <button class="icon">
            ❔
        </button>

        <button class="icon">
            ⚙️
        </button>

        <button class="icon">
            ●
        </button>

    </div>

</header>


<section class="content">

    <div class="heading">

        <h2>
            My Drive
        </h2>

        <div class="view">

            <button onclick="toggleView()">
                ☷
            </button>

        </div>

    </div>


    <!-- FOLDERS -->
    <div id="folders" class="cards"></div>


    <!-- FILES -->
    <table id="filesTable" class="table">

        <thead>

            <tr>

                <th>Name</th>

                <th>Owner</th>

                <th>Last modified</th>

                <th>File size</th>

            </tr>

        </thead>

        <tbody></tbody>

    </table>


    <div id="empty" class="empty">
        No files found
    </div>

</section>

</main>

</div>


<script>

/* DEFAULT FILES */

let files = [

    {
        name: 'Project Documents',
        type: 'folder',
        owner: 'Me',
        modified: 'Sep 10, 2026',
        size: '—'
    },

    {
        name: 'Photos',
        type: 'folder',
        owner: 'Me',
        modified: 'Sep 8, 2026',
        size: '—'
    },

    {
        name: 'Work',
        type: 'folder',
        owner: 'Me',
        modified: 'Sep 5, 2026',
        size: '—'
    },

    {
        name: 'Resume.pdf',
        type: 'pdf',
        owner: 'Me',
        modified: 'Sep 3, 2026',
        size: '2.4 MB'
    },

    {
        name: 'Salary Structure.xlsx',
        type: 'xlsx',
        owner: 'Me',
        modified: 'Sep 2, 2026',
        size: '48 KB'
    },

    {
        name: 'Notes.docx',
        type: 'docx',
        owner: 'Me',
        modified: 'Aug 30, 2026',
        size: '124 KB'
    }

];


/* UPLOAD */

function uploadFile() {

    document
        .getElementById('fileInput')
        .click();

}


/* HANDLE UPLOAD */

function handleFiles(list) {

    for (const f of list) {

        files.unshift({

            name: f.name,

            type:
                f.name.split('.').pop()
                || 'file',

            owner: 'Me',

            modified: 'Just now',

            size:
                (f.size / 1024 / 1024)
                .toFixed(2)
                + ' MB'

        });

    }

    render();

}


/* FILE ICON */

function icon(type) {

    if (type === 'folder') {
        return '📁';
    }

    if (type === 'pdf') {
        return '📕';
    }

    if (type === 'xlsx') {
        return '📊';
    }

    if (type === 'docx') {
        return '📘';
    }

    return '📄';

}


/* RENDER */

function render() {

    const q =
        document
        .getElementById('search')
        .value
        .toLowerCase();


    const filtered =
        files.filter(
            f =>
                f.name
                .toLowerCase()
                .includes(q)
        );


    const folders =
        document
        .getElementById('folders');


    const tbody =
        document
        .querySelector(
            '#filesTable tbody'
        );


    const empty =
        document
        .getElementById('empty');


    /* FOLDERS */

    folders.innerHTML =

        filtered
        .filter(
            f => f.type === 'folder'
        )
        .map(

            f => `

                <div
                    class="card"
                    onclick="alert('Opening ${f.name}')"
                >

                    <div class="folderIcon">
                        📁
                    </div>

                    <div class="cardTitle">
                        ${f.name}
                    </div>

                    <div class="meta">
                        Folder
